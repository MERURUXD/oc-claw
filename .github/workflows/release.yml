name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and release Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $cargoText = Get-Content src-tauri/Cargo.toml -Raw
          $cargoMatch = [regex]::Match($cargoText, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) { throw "Could not read package.version from Cargo.toml" }
          $cargoVersion = $cargoMatch.Groups[1].Value
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauriVersion = $tauri.version
          if ($tagVersion -ne $cargoVersion -or $tagVersion -ne $tauriVersion) {
            throw "Version mismatch: tag=$tagVersion Cargo.toml=$cargoVersion tauri.conf.json=$tauriVersion"
          }
          Write-Host "Release version validated: $tagVersion"

      - name: Build NSIS installer
        run: pnpm exec tauri build --bundles nsis

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
